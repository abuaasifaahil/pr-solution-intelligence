name: prsi-m1

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prsi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prsi_dev}
      POSTGRES_DB: ${POSTGRES_DB:-prsi}
    ports:
      - '5432:5432'
    volumes:
      - prsi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-prsi} -d ${POSTGRES_DB:-prsi}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - prsi_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 2 — S3-compatible object storage for local dev. Production swaps to
  # AWS S3 by setting STORAGE_MODE=s3 + AWS credentials (see
  # docs/storage-migration.md). The bucket below is auto-created by minio-init.
  minio:
    image: minio/minio:latest
    container_name: prsi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: prsi
      MINIO_ROOT_PASSWORD: prsi_dev_minio
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # web console
    volumes:
      - prsi_miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: prsi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 prsi prsi_dev_minio &&
      mc mb --ignore-existing local/prsi-uploads &&
      echo 'MinIO bucket prsi-uploads ready'
      "
    restart: 'no'

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prsi}:${POSTGRES_PASSWORD:-prsi_dev}@postgres:5432/${POSTGRES_DB:-prsi}?schema=public
    working_dir: /repo/shared
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy', '--schema=db/schema.prisma']
    restart: 'no'

  seed:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prsi}:${POSTGRES_PASSWORD:-prsi_dev}@postgres:5432/${POSTGRES_DB:-prsi}?schema=public
    working_dir: /repo/shared
    command: ['node_modules/.bin/tsx', 'db/seed.ts']
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-prsi}:${POSTGRES_PASSWORD:-prsi_dev}@postgres:5432/${POSTGRES_DB:-prsi}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/healthz']
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:3001
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/healthz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  prsi_pgdata:
  prsi_redisdata:
  prsi_miniodata:
