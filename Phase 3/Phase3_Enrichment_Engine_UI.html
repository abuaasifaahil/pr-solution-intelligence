.pg-w{margin-bottom:14px}.pg-tp{display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:4px}.pg-l{color:var(--ts);font-weight:500}.pg-p{color:var(--orange);font-weight:700;font-family:var(--m)}.pg-br{height:6px;background:#EEE;border-radius:3px;overflow:hidden}.pg-fl{height:100%;background:linear-gradient(90deg,var(--orange),#F59E0B);border-radius:3px;transition:width .4s var(--ease)}

.cu-ct{height:400px;overflow:auto}

.jv{padding:16px;font-family:var(--m);font-size:.76rem;line-height:1.65;background:#1E1E2E;color:#CDD6F4;white-space:pre;overflow-x:auto;min-height:100%}
.jv .jk{color:#89B4FA}.jv .js{color:#A6E3A1}.jv .jn{color:#FAB387}.jv .jb{color:#F38BA8}
/* Preview Article Cards */
.pv{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.ac{background:var(--bg);border:1px solid var(--bd);border-radius:var(--rm);padding:14px}
.ac-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}.ac-title{font-size:.88rem;font-weight:600;flex:1;margin-right:8px}.ac-thumb{width:56px;height:38px;border-radius:4px;background:#DDD;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.55rem;color:var(--tt);overflow:hidden}

.ac-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}.at{padding:2px 7px;border-radius:var(--rp);font-size:.64rem;font-weight:600}
.at.pos{background:#E8F5E9;color:#2E7D32}.at.neg{background:#FFEBEE;color:#C62828}.at.neu{background:#FFF8E1;color:#F57F17}.at.th{background:#FFF3E0;color:#E65100}.at.em{background:#FCE4EC;color:#AD1457}.at.en{background:#E3F2FD;color:#1565C0}.at.sg{background:#F3E5F5;color:#6A1B9A}
.ac-conf{font-size:.68rem;color:var(--tt);display:flex;gap:8px}.ac-conf span{display:flex;align-items:center;gap:2px}
.ac-rsn{font-size:.7rem;color:var(--ts);margin-top:6px;padding-top:6px;border-top:1px solid var(--bs);line-height:1.4;font-style:italic}
.ac-eng{display:flex;gap:10px;margin-top:6px;padding-top:6px;border-top:1px solid var(--bs);font-size:.7rem;color:var(--ts)}.ac-eng span{display:flex;align-items:center;gap:2px}

.ov{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);align-items:center;justify-content:center}.ov.op{display:flex}

.ov-tb{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--bd)}
.ov-cl{width:32px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--ts);transition:background .15s}.ov-cl:hover{background:var(--hover);color:var(--red)}
.ov-bd{flex:1;overflow:auto}
/* Input */
.cb{padding:14px 20px;background:var(--card);border-top:1px solid var(--bs)}.cb-w{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:7px}.ci{flex:1;padding:9px 14px;border:1.5px solid var(--bd);border-radius:var(--rl);font-size:.9rem;background:var(--bg);color:var(--tp);outline:none}.ci:focus{border-color:var(--b500)}.cs{width:36px;height:36px;border-radius:var(--rm);background:var(--b500);color:#fff;display:flex;align-items:center;justify-content:center}.cs:hover{background:#1A86D8}.cs svg{width:16px;height:16px}

<script>
const C=document.getElementById('C');
const ED=[
  {id:"art-001",title:"FreshSip Launches New Organic Line",source:"Reuters",author:"J. Martinez",published_date:"2026-05-18",url:"https://reuters.com/freshsip-organic",publisher_domain:"reuters.com",language:"en",media_type:"Online News",location:"New York, USA",thumbnail_url:"reuters_thumb.jpg",description:"FreshSip announced the launch of its new organic beverage line targeting health-conscious consumers across North America.",content:"FreshSip today unveiled its highly anticipated organic beverage line...",enrichment:{sentiment:{label:"Positive",confidence:.92,reason:"Article highlights product innovation and positive market positioning with no negative framing."},themes:[{level:"Main",name:"Product Launch",confidence:.95,reason:"Core topic is the announcement of a new product line."},{level:"Secondary",name:"Health & Wellness",confidence:.88,reason:"Strong emphasis on organic and health-conscious positioning."},{level:"Tertiary",name:"CPG Innovation",confidence:.72,reason:"Broader industry innovation context mentioned."}],emotion:{label:"Trust",intensity:.85},entities:[{type:"Brand",name:"FreshSip",mentions:8},{type:"Competitor",name:"PepsiCo",mentions:2},{type:"Person",name:"Sarah Chen",mentions:3},{type:"Organization",name:"FDA",mentions:1}],signals:[{type:"Emerging",description:"Growing organic beverage segment",reason:"Third major brand launch in organic space this quarter."}],reach:{domain:"reuters.com",monthly_visitors:524000000,score:98}}},
  {id:"art-002",title:"PepsiCo vs FreshSip: Market Share Battle",source:"Forbes",author:"M. Jones",published_date:"2026-05-16",url:"https://forbes.com/pepsico-freshsip",publisher_domain:"forbes.com",language:"en",media_type:"Online News",location:"San Francisco, USA",thumbnail_url:"forbes_thumb.jpg",description:"An analysis of the competitive dynamics between PepsiCo and FreshSip in the North American beverage market.",content:"The North American beverage landscape is shifting...",enrichment:{sentiment:{label:"Neutral",confidence:.87,reason:"Balanced analytical piece presenting both sides of the competitive landscape without bias."},themes:[{level:"Main",name:"Competitive Analysis",confidence:.93,reason:"Article directly compares two brands market positions."},{level:"Secondary",name:"Market Share",confidence:.89,reason:"Revenue and market share data are central."},{level:"Tertiary",name:"Consumer Trends",confidence:.68,reason:"Brief mention of shifting consumer preferences."}],emotion:{label:"Anticipation",intensity:.62},entities:[{type:"Brand",name:"FreshSip",mentions:12},{type:"Competitor",name:"PepsiCo",mentions:15},{type:"Competitor",name:"Coca-Cola",mentions:4},{type:"Organization",name:"Nielsen",mentions:2}],signals:[{type:"Emerging",description:"FreshSip gaining in under-35 demographics",reason:"Nielsen data shows accelerating share shift."}],reach:{domain:"forbes.com",monthly_visitors:189000000,score:94}}},
  {id:"art-003",title:"Loving our new organic line! 🌿 #FreshSip #OrganicLife",source:"Instagram",author:"@freshsip_official",published_date:"2026-05-19",url:"https://instagram.com/p/abc123",publisher_domain:"instagram.com",language:"en",media_type:"Social Media",location:"Los Angeles, USA",thumbnail_url:"ig_thumb.jpg",description:"Official FreshSip Instagram post promoting the new organic line with product imagery and lifestyle content.",content:"Loving our new organic line! Pure ingredients, bold flavors...",social_engagement:{likes:24500,comments:1832,shares:4210,impressions:892000,engagement_rate:3.42,saves:6100,reach:478000},enrichment:{sentiment:{label:"Positive",confidence:.96,reason:"Promotional content with enthusiastic tone and positive emoji usage, strong audience resonance."},themes:[{level:"Main",name:"Brand Promotion",confidence:.97,reason:"Official brand marketing post on social."},{level:"Secondary",name:"Health & Wellness",confidence:.84,reason:"Organic messaging aligns with wellness trend."},{level:"Tertiary",name:"Social Engagement",confidence:.79,reason:"Exceptionally high engagement rate indicates trend."}],emotion:{label:"Joy",intensity:.91},entities:[{type:"Brand",name:"FreshSip",mentions:3},{type:"Organization",name:"Instagram",mentions:1}],signals:[{type:"Emerging",description:"Viral organic content pattern",reason:"3.42% engagement rate exceeds industry average of 1.8%."}],reach:{domain:"instagram.com",monthly_visitors:2000000000,score:99}}}
];

function bJSON(){return JSON.stringify(ED,null,2).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"([^"]+)":/g,'<span class="jk">"$1"</span>:').replace(/: "([^"]*?)"/g,': <span class="js">"$1"</span>').replace(/: (\d+\.?\d*)/g,': <span class="jn">$1</span>').replace(/: (true|false)/g,': <span class="jb">$1</span>')}

function bCards(){return ED.map(a=>{
  const s=a.enrichment.sentiment,sc={Positive:'pos',Negative:'neg',Neutral:'neu',Mixed:'mix'}[s.label]||'neu';
  const ths=a.enrichment.themes.map(t=>`<span class="at th">${t.level}: ${t.name} (${(t.confidence*100).toFixed(0)}%)</span>`).join('');
  const ents=a.enrichment.entities.slice(0,4).map(e=>`<span class="at en">${e.type}: ${e.name} (×${e.mentions})</span>`).join('');
  const sigs=a.enrichment.signals.map(g=>`<span class="at sg">${g.type}: ${g.description}</span>`).join('');
  const soc=a.social_engagement?`<div class="ac-eng"><span>❤️ ${a.social_engagement.likes.toLocaleString()}</span><span>💬 ${a.social_engagement.comments.toLocaleString()}</span><span>🔄 ${a.social_engagement.shares.toLocaleString()}</span><span>👁 ${a.social_engagement.impressions.toLocaleString()}</span><span>📊 ${a.social_engagement.engagement_rate}%</span><span>💾 ${a.social_engagement.saves.toLocaleString()}</span><span>📡 ${(a.social_engagement.reach/1000).toFixed(0)}K reach</span></div>`:'';
  return `<div class="ac"><div class="ac-top"><div class="ac-title">${a.title}</div><div class="ac-thumb">${a.media_type==='Social Media'?'📱':'📰'}</div></div>
  <div class="ac-meta"><span>📰 ${a.source}</span><span>✍️ ${a.author}</span><span>📅 ${a.published_date}</span><span>🌐 ${a.publisher_domain}</span><span>📍 ${a.location}</span><span>🔤 ${a.language}</span><span>📺 ${a.media_type}</span>${a.enrichment.reach?`<span>👥 ${(a.enrichment.reach.monthly_visitors/1e6).toFixed(0)}M</span>`:''}</div>
  <div class="ac-tags"><span class="at ${sc}">Sentiment: ${s.label} (${(s.confidence*100).toFixed(0)}%)</span><span class="at em">Emotion: ${a.enrichment.emotion.label} (${(a.enrichment.emotion.intensity*100).toFixed(0)}%)</span>${ths}${ents}${sigs}</div>
  <div class="ac-conf"><span>🎯 Sent: ${(s.confidence*100).toFixed(0)}%</span><span>📊 Theme: ${(a.enrichment.themes[0].confidence*100).toFixed(0)}%</span><span>💡 Emo: ${(a.enrichment.emotion.intensity*100).toFixed(0)}%</span><span>🏷️ Entities: ${a.enrichment.entities.length}</span></div>
  <div class="ac-rsn"><strong>AI Reasoning:</strong> ${s.reason}</div>${soc}</div>`}).join('')}

let cTab='preview';
function sTab(t,el){cTab=t;document.querySelectorAll('.cu-tab').forEach(x=>x.classList.remove('act'));el.classList.add('act');rTab()}
function rTab(){const el=document.getElementById('CC');if(cTab==='json')el.innerHTML=`<div class="jv">${bJSON()}</div>`;else el.innerHTML=`<div class="pv">${bCards()}</div>`}
function exCU(){document.getElementById('CUC').style.display='none';document.getElementById('CUE').classList.add('op');rTab();C.scrollTop=C.scrollHeight}
function clCU(){document.getElementById('CUE').classList.remove('op');document.getElementById('CUC').style.display='flex'}
function opOv(t){cTab=t||'preview';const b=document.getElementById('OB');if(cTab==='json')b.innerHTML=`<div class="jv" style="min-height:100%">${bJSON()}</div>`;else b.innerHTML=`<div class="pv" style="padding:20px">${bCards()}</div>`;document.getElementById('OV').classList.add('op')}
function clOv(){document.getElementById('OV').classList.remove('op')}
function dl(){const b=new Blob([JSON.stringify(ED,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='freshsip_enriched_data.json';a.click()}

function aAI(h,x=''){const d=document.createElement('div');d.className='mg ai';d.innerHTML=`<div class="mg-a">AI</div><div style="flex:1;max-width:700px"><div class="mg-b">${h}</div>${x}</div>`;C.appendChild(d);C.scrollTop=C.scrollHeight}
function aU(t){const d=document.createElement('div');d.className='mg u';d.innerHTML=`<div class="mg-a">KB</div><div><div class="mg-b">${t}</div></div>`;C.appendChild(d);C.scrollTop=C.scrollHeight}
function aW(h){const d=document.createElement('div');d.className='mg ai';d.innerHTML=`<div class="mg-a">AI</div><div style="flex:1;max-width:720px">${h}</div>`;C.appendChild(d);C.scrollTop=C.scrollHeight}
function snd(){const el=document.getElementById('I');if(!el.value.trim())return;aU(el.value.trim());el.value=''}
function w(ms){return new Promise(r=>setTimeout(r,ms))}

async function run(){
  aAI(`<strong>Phase 2 Complete</strong> — 2,847 articles parsed from your FreshSip brand analysis.<br><br>Starting <strong>Enrichment Engine</strong> with <strong>Enrichment + Reach</strong> mode using <strong>Claude claude-sonnet-4</strong>...`);
  await w(800);

  aW(`<div class="ec" id="EC"><div class="ec-h"><div class="ec-sp" id="eSp"></div><div class="ec-t" id="eT">Enrichment Agent — Processing</div><span class="ec-md">Claude claude-sonnet-4</span></div>
  <div class="ec-bd">
    <div class="pg-w"><div class="pg-tp"><span class="pg-l">Enriching articles...</span><span class="pg-p" id="eP">0%</span></div><div class="pg-br"><div class="pg-fl" id="eB" style="width:0%"></div></div></div>
    <div class="bg"><div class="bi"><div class="bv b" id="bA">0 / 2,847</div><div class="bl">Articles</div></div><div class="bi"><div class="bv o" id="bB">0 / 12</div><div class="bl">Batches</div></div><div class="bi"><div class="bv" id="bT">0</div><div class="bl">Tokens</div></div><div class="bi"><div class="bv" id="bTm">0.0s</div><div class="bl">Elapsed</div></div></div>
    <div class="tr"><span class="tp st">Sentiment</span><span class="tp th">Themes (3-level)</span><span class="tp em">Emotion</span><span class="tp en">Entities</span><span class="tp sg">Signals</span><span class="tp rc">Reach</span></div>
    <div class="sl"><div class="sr a" id="s1"><span class="si">⟳</span>Loading articles from database<span class="stm"></span></div><div class="sr p" id="s2"><span class="si">○</span>Calculating token-optimized batches<span class="stm"></span></div><div class="sr p" id="s3"><span class="si">○</span>Processing batches through Claude LLM<span class="stm"></span></div><div class="sr p" id="s4"><span class="si">○</span>Validating enrichment JSON schemas<span class="stm"></span></div><div class="sr p" id="s5"><span class="si">○</span>Similar Web Agent — fetching reach data<span class="stm"></span></div><div class="sr p" id="s6"><span class="si">○</span>Merging reach into enrichments<span class="stm"></span></div><div class="sr p" id="s7"><span class="si">○</span>Generating dashboard-ready JSON<span class="stm"></span></div></div>
  </div></div>`);

  function cs(n,t){const e=document.getElementById('s'+n);e.className='sr d';e.querySelector('.si').textContent='✓';if(t)e.querySelector('.stm').textContent=t}
  function as(n){const e=document.getElementById('s'+n);e.className='sr a';e.querySelector('.si').textContent='⟳'}

  await w(600);cs(1,'0.6s');as(2);await w(400);cs(2,'0.4s');as(3);

  for(let b=1;b<=12;b++){
    const p=Math.round((b/12)*78);
    document.getElementById('eB').style.width=p+'%';document.getElementById('eP').textContent=p+'%';
    document.getElementById('bA').textContent=`${Math.round(2847*b/12).toLocaleString()} / 2,847`;
    document.getElementById('bB').textContent=`${b} / 12`;
    document.getElementById('bT').textContent=(b*18400).toLocaleString();
    document.getElementById('bTm').textContent=`${(b*1.8).toFixed(1)}s`;
    await w(220);C.scrollTop=C.scrollHeight;
  }
  cs(3,'21.6s');as(4);await w(300);cs(4,'0.3s');as(5);await w(300);

  aW(`<div class="swc"><div class="sw-h"><span class="sw-t">🌐 Similar Web Agent — Running in Parallel</span><span class="sw-b">Active</span></div><div class="sw-s"><div><div class="sw-v">234</div><div class="sw-l">Domains</div></div><div><div class="sw-v">228</div><div class="sw-l">Resolved</div></div><div><div class="sw-v">97.4%</div><div class="sw-l">Coverage</div></div><div><div class="sw-v">1.8s</div><div class="sw-l">Duration</div></div></div></div>`);

  await w(600);cs(5,'1.8s');document.getElementById('eB').style.width='90%';document.getElementById('eP').textContent='90%';as(6);
  await w(200);cs(6,'0.2s');as(7);await w(500);cs(7,'0.5s');

  document.getElementById('eB').style.width='100%';document.getElementById('eB').style.background='linear-gradient(90deg,var(--green),#4CAF50)';document.getElementById('eP').textContent='100%';
  document.getElementById('eSp').style.display='none';document.getElementById('eT').textContent='Enrichment Agent — Complete ✓';document.getElementById('eT').style.color='var(--green)';
  await w(400);

  aW(`<div class="cc"><div class="cc-h" onclick="this.nextElementSibling.classList.toggle('op');this.querySelector('.cc-tg').textContent=this.nextElementSibling.classList.contains('op')?'Collapse':'Expand'"><div class="cc-i">✓</div><div class="cc-t">Enrichment Complete — Ready for Dashboard</div><span class="cc-tg">Expand</span></div><div class="cc-b"><div class="cc-sts"><div><div class="cc-sv">2,847</div><div class="cc-sl">Articles</div></div><div><div class="cc-sv">12</div><div class="cc-sl">Batches</div></div><div><div class="cc-sv">220,800</div><div class="cc-sl">Tokens</div></div><div><div class="cc-sv">234</div><div class="cc-sl">Domains</div></div><div><div class="cc-sv">97.4%</div><div class="cc-sl">Coverage</div></div><div><div class="cc-sv">25.4s</div><div class="cc-sl">Total Time</div></div><div><div class="cc-sv">Claude</div><div class="cc-sl">Model</div></div><div><div class="cc-sv">6</div><div class="cc-sl">Dimensions</div></div></div></div></div>`);

  await w(500);
  aAI(`Your enriched data is ready! Click below to preview articles with all tags, or view the JSON code.`);
  await w(300);

  aW(`<div class="cu" id="CUW"><div class="cu-c" id="CUC" onclick="exCU()"><div class="cu-i">E</div><div class="cu-inf"><div class="cu-tl">Enriched Data — 2,847 articles · 6 dimensions · Reach included</div><div class="cu-mt">Sentiment · Themes (3-level) · Emotion · Entities · Signals · Reach — JSON + Preview</div></div><div class="cu-act"><button class="cu-btn" onclick="event.stopPropagation();opOv('json')">{ } Code</button><button class="cu-btn pr" onclick="event.stopPropagation();exCU()">▶ Preview</button><button class="cu-btn" onclick="event.stopPropagation();opOv('preview')">⬗ Window</button><button class="cu-btn" onclick="event.stopPropagation();dl()">⬇</button><button class="cu-btn" onclick="event.stopPropagation();alert('Copied!')">🔗</button><button class="cu-btn" onclick="event.stopPropagation();alert('Email')">✉</button></div></div>
  <div class="cu-e" id="CUE"><div class="cu-tb"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:.85rem;font-weight:600">Enriched Data Preview</span><div class="cu-tbs"><button class="cu-tab act" onclick="sTab('preview',this)">Preview</button><button class="cu-tab" onclick="sTab('json',this)">JSON Code</button></div></div><div style="display:flex;gap:4px"><button class="cu-btn" onclick="opOv(cTab)">⬗ Window</button><button class="cu-btn" onclick="dl()">⬇ Download</button><button class="cu-btn" onclick="clCU()">▼ Collapse</button></div></div><div class="cu-ct" id="CC"></div></div></div>`);
}
run();
</script>
